<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Trainer A1–B1</title>
<style>
:root{
  color-scheme: light dark;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#f0efeb; --ink:#1b1b1a; --muted:#6d6a63;
  --line:#e0ddd6; --accent:#c2410c; --accent2:#0e7490; --good:#15803d; --bad:#b91c1c;
  --gold:#b45309; --shadow:0 2px 10px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --panel:#1e2027; --panel2:#262932; --ink:#eceae5; --muted:#a5a29b;
    --line:#333844; --accent:#fb923c; --accent2:#22d3ee; --good:#4ade80; --bad:#f87171;
    --gold:#fbbf24; --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --panel:#1e2027; --panel2:#262932; --ink:#eceae5; --muted:#a5a29b;
  --line:#333844; --accent:#fb923c; --accent2:#22d3ee; --good:#4ade80; --bad:#f87171;
  --gold:#fbbf24; --shadow:0 2px 12px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--muted);font-weight:500;font-size:.85rem;display:block}
.spacer{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow)}

/* HUD */
.hud{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.hud-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem}
.chipstat{background:var(--panel2);border-radius:999px;padding:3px 10px;white-space:nowrap}
.bar{height:9px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s ease}
.rank{font-weight:700;color:var(--accent)}

/* tabs */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
nav.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:.88rem}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.levels{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
.levels button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem}
.levels button[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:#04222a;font-weight:700}

/* panel */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.center{text-align:center}
.de{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin:6px 0}
.de small{display:block;font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:0}
.es{font-size:1.25rem;color:var(--accent2);font-weight:600}
.ex{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.95rem}
.ex .exde{font-style:italic}
.ex .exes{color:var(--muted);font-size:.88rem}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:0 3px}
.hidden{display:none !important}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:.92rem;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:transparent;border-color:var(--good);color:var(--good)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:active{transform:translateY(1px)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.opt:disabled{cursor:default;opacity:.85}
.feedback{margin-top:14px;font-size:.92rem;padding:10px 12px;border-radius:12px;background:var(--panel2);border-left:4px solid var(--accent2)}
.feedback b{color:var(--accent)}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:1.15rem;text-align:center}
.umlauts{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.umlauts button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:1rem}
.hint{font-size:.85rem;color:var(--muted);margin-top:10px}
.meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.grid{display:grid;gap:10px}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}
details.g{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
details.g summary{cursor:pointer;font-weight:700;list-style:none}
details.g summary::-webkit-details-marker{display:none}
details.g summary::before{content:"▸ ";color:var(--accent)}
details.g[open] summary::before{content:"▾ "}
details.g .body{margin-top:10px;font-size:.93rem}
details.g table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem;display:block;overflow-x:auto}
details.g th,details.g td{border:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
details.g th{background:var(--panel2)}
code{background:var(--panel2);padding:1px 5px;border-radius:6px;font-size:.9em}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:.78rem;opacity:.4}
.badge.on{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.badge b{display:block;font-size:1.5rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;z-index:50;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
footer{margin-top:22px;font-size:.78rem;color:var(--muted);text-align:center}
.overflow-x{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>Deutsch Trainer <span>Vocabulario y gramática A1 → B1 · ayudas en español</span></h1>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" title="Tema">🌗</button>
  <button class="icon-btn" id="resetBtn" title="Reiniciar progreso">↺</button>
</header>

<div class="hud">
  <div class="hud-row">
    <span class="rank" id="rank">Anfänger</span>
    <span class="chipstat">⭐ <b id="xp">0</b> XP</span>
    <span class="chipstat">🔥 combo <b id="combo">0</b></span>
    <span class="chipstat">📅 racha <b id="days">0</b> d</span>
    <span class="chipstat">🎯 hoy <b id="today">0</b>/<span id="goal">60</span></span>
    <span class="chipstat" id="heartsBox">❤️❤️❤️</span>
  </div>
  <div class="bar"><i id="xpbar"></i></div>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" data-mode="flash" aria-selected="true">🃏 Flashcards</button>
  <button role="tab" data-mode="quiz">🎯 Quiz ES↔DE</button>
  <button role="tab" data-mode="artikel">🔤 Der/Die/Das</button>
  <button role="tab" data-mode="gram">📐 Gramática</button>
  <button role="tab" data-mode="write">⌨️ Escribir</button>
  <button role="tab" data-mode="verbs">🔁 Conjugar</button>
  <button role="tab" data-mode="ref">📖 Reglas</button>
  <button role="tab" data-mode="stats">🏅 Logros</button>
</nav>

<div class="levels">
  Nivel:
  <button data-lvl="A1" aria-pressed="true">A1</button>
  <button data-lvl="A2" aria-pressed="true">A2</button>
  <button data-lvl="B1" aria-pressed="false">B1</button>
  <span id="poolInfo"></span>
</div>

<main id="view"></main>

<footer>Consejo: repasa 10 minutos al día. La constancia gana a las sesiones largas. · Los datos se guardan en tu navegador.</footer>
</div>
<div class="toast" id="toast"></div>

/* ============ DATOS: GRAMÁTICA (referencia) ============ */
const GRAMMAR = [
{l:"A1",t:"Los tres artículos: der / die / das",b:`En alemán cada sustantivo tiene género y <b>hay que aprenderlo con la palabra</b> (no coincide con el español: <code>die Sonne</code> = el sol, <code>der Mond</code> = la luna).
<br>Trucos útiles: terminaciones <code>-ung, -heit, -keit, -schaft, -ion, -tät, -e</code> → <b>die</b>; <code>-er, -ling, -ismus</code> y días/meses/estaciones → <b>der</b>; <code>-chen, -lein, -um, -ment</code> e infinitivos sustantivados → <b>das</b>.
<br>Truco de estudio: memoriza siempre <i>artículo + palabra + plural</i> en bloque.`},
{l:"A1",t:"Presente: conjugación regular",b:`Raíz + terminaciones: <code>-e, -st, -t, -en, -t, -en</code>.
<table><tr><th>lernen</th><th></th><th></th></tr><tr><td>ich lerne</td><td>du lernst</td><td>er/sie/es lernt</td></tr><tr><td>wir lernen</td><td>ihr lernt</td><td>sie/Sie lernen</td></tr></table>
Si la raíz acaba en <code>-t/-d</code> se añade una <b>e</b>: <code>du arbeitest, er arbeitet</code>.`},
{l:"A1",t:"Verbos irregulares: cambio de vocal",b:`Solo cambian en <b>du</b> y <b>er/sie/es</b>:
<br>• <code>e → i</code>: sprechen → du sprichst, er spricht; essen → du isst, er isst; geben → du gibst.
<br>• <code>e → ie</code>: sehen → du siehst; lesen → du liest.
<br>• <code>a → ä</code>: fahren → du fährst; schlafen → er schläft.
<table><tr><th></th><th>sein</th><th>haben</th></tr><tr><td>ich</td><td>bin</td><td>habe</td></tr><tr><td>du</td><td>bist</td><td>hast</td></tr><tr><td>er/sie/es</td><td>ist</td><td>hat</td></tr><tr><td>wir/sie/Sie</td><td>sind</td><td>haben</td></tr><tr><td>ihr</td><td>seid</td><td>habt</td></tr></table>`},
{l:"A1",t:"El verbo en segunda posición",b:`En la frase principal, el verbo conjugado ocupa <b>siempre</b> la posición 2, aunque delante haya un complemento:
<br><code>Heute <b>gehe</b> ich ins Kino.</code> (Hoy voy al cine.)
<br><code>Ins Kino <b>gehe</b> ich heute.</code>
<br>Nunca *<i>Heute ich gehe…</i> — ese es el error más típico de hispanohablantes.
<br>En preguntas con W- el verbo va también en 2ª: <code>Wann <b>kommst</b> du?</code>; en preguntas de sí/no, en 1ª: <code><b>Kommst</b> du?</code>`},
{l:"A1",t:"Nominativo y acusativo",b:`El <b>nominativo</b> es el sujeto; el <b>acusativo</b>, el complemento directo. Solo cambia el masculino.
<table><tr><th></th><th>m.</th><th>f.</th><th>n.</th><th>pl.</th></tr>
<tr><th>Nom.</th><td>der / ein</td><td>die / eine</td><td>das / ein</td><td>die / –</td></tr>
<tr><th>Akk.</th><td><b>den / einen</b></td><td>die / eine</td><td>das / ein</td><td>die / –</td></tr></table>
<code>Der Mann kauft <b>den</b> Apfel.</code> (El hombre compra la manzana.)`},
{l:"A1",t:"Negación: nicht vs. kein",b:`• <b>kein-</b> niega sustantivos con artículo indeterminado o sin artículo: <code>Ich habe <b>kein</b> Auto.</code> Se declina como <code>ein</code>: <code>Ich sehe <b>keinen</b> Hund.</code>
<br>• <b>nicht</b> niega verbos, adjetivos, adverbios o sustantivos con artículo definido: <code>Ich arbeite heute <b>nicht</b>.</code> <code>Das ist <b>nicht</b> gut.</code>
<br>Posición: <code>nicht</code> va al final, pero <b>antes</b> del adjetivo, del complemento con preposición o del verbo final.`},
{l:"A1",t:"Verbos modales y la estructura de paréntesis",b:`<table><tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th><th>mögen</th></tr>
<tr><td>ich/er</td><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td><td>mag</td></tr>
<tr><td>du</td><td>kannst</td><td>musst</td><td>willst</td><td>darfst</td><td>sollst</td><td>magst</td></tr>
<tr><td>wir</td><td>können</td><td>müssen</td><td>wollen</td><td>dürfen</td><td>sollen</td><td>mögen</td></tr></table>
El modal se conjuga en posición 2 y el infinitivo se va <b>al final</b>: <code>Ich <b>muss</b> heute früh nach Hause <b>gehen</b>.</code>
<br>Ojo: <code>müssen</code> ≠ deber moral; la negación de "no tener que" es <code>nicht müssen</code>, mientras que <code>nicht dürfen</code> = "no estar permitido".`},
{l:"A1",t:"Plural: las cinco familias",b:`No hay una regla única; apréndelo con la palabra.
<table><tr><th>Tipo</th><th>Ejemplo</th></tr>
<tr><td>-e (a veces + Umlaut)</td><td>der Tisch → die Tisch<b>e</b>; der Stuhl → die St<b>ü</b>hl<b>e</b></td></tr>
<tr><td>-er (+ Umlaut)</td><td>das Buch → die B<b>ü</b>ch<b>er</b></td></tr>
<tr><td>-(e)n</td><td>die Frau → die Frau<b>en</b>; die Katze → die Katze<b>n</b></td></tr>
<tr><td>-s (extranjerismos)</td><td>das Auto → die Auto<b>s</b></td></tr>
<tr><td>sin cambio (a veces Umlaut)</td><td>das Fenster → die Fenster; der Vater → die V<b>ä</b>ter</td></tr></table>
En plural el artículo definido es siempre <b>die</b>.`},
{l:"A2",t:"El dativo",b:`Marca el complemento indirecto (a quién) y va tras ciertas preposiciones y verbos.
<table><tr><th></th><th>m.</th><th>f.</th><th>n.</th><th>pl.</th></tr>
<tr><th>Dat.</th><td>dem / einem</td><td>der / einer</td><td>dem / einem</td><td>den + <b>-n</b></td></tr></table>
Verbos siempre con dativo: <code>helfen, danken, gefallen, gehören, antworten, passen, schmecken</code>.
<br><code>Ich helfe <b>dem</b> Mann.</code> · <code>Das Buch gefällt <b>mir</b>.</code> (El libro me gusta.)
<br>Pronombres: mir, dir, ihm, ihr, ihm, uns, euch, ihnen/Ihnen.`},
{l:"A2",t:"Preposiciones: Dativo, Acusativo y mixtas",b:`• Siempre <b>dativo</b>: <code>aus, bei, mit, nach, seit, von, zu, gegenüber</code>.
<br>• Siempre <b>acusativo</b>: <code>durch, für, gegen, ohne, um, bis</code>.
<br>• <b>Mixtas (Wechselpräpositionen)</b>: <code>in, an, auf, über, unter, vor, hinter, neben, zwischen</code>.
<br>→ <b>Wohin?</b> (movimiento) = acusativo: <code>Ich gehe in <b>die</b> Schule.</code>
<br>→ <b>Wo?</b> (lugar) = dativo: <code>Ich bin in <b>der</b> Schule.</code>`},
{l:"A2",t:"Perfekt: el pasado hablado",b:`<code>haben/sein</code> (posición 2) + <b>participio al final</b>.
<br>• Regulares: <code>ge- + raíz + -t</code> → machen → <b>gemacht</b>.
<br>• Irregulares: <code>ge- + raíz + -en</code> → sprechen → <b>gesprochen</b>; gehen → <b>gegangen</b>.
<br>• Verbos en <code>-ieren</code> y con prefijo inseparable (be-, er-, ver-, ent-, ge-, zer-) <b>sin ge-</b>: studieren → <b>studiert</b>; verstehen → <b>verstanden</b>.
<br><b>sein</b> con verbos de movimiento o cambio de estado: <code>gehen, fahren, kommen, bleiben, sein, werden, aufstehen</code>.
<br><code>Ich <b>habe</b> gestern Fußball <b>gespielt</b>.</code> · <code>Wir <b>sind</b> nach Berlin <b>gefahren</b>.</code>`},
{l:"A2",t:"Präteritum de sein, haben y modales",b:`Aunque el pasado hablado sea el Perfekt, estos verbos se usan en Präteritum incluso al hablar.
<table><tr><th></th><th>sein</th><th>haben</th><th>können</th><th>müssen</th><th>wollen</th></tr>
<tr><td>ich/er</td><td>war</td><td>hatte</td><td>konnte</td><td>musste</td><td>wollte</td></tr>
<tr><td>du</td><td>warst</td><td>hattest</td><td>konntest</td><td>musstest</td><td>wolltest</td></tr>
<tr><td>wir/sie</td><td>waren</td><td>hatten</td><td>konnten</td><td>mussten</td><td>wollten</td></tr></table>
<code>Gestern <b>war</b> ich krank und <b>konnte</b> nicht kommen.</code>`},
{l:"A2",t:"Oraciones subordinadas: el verbo al final",b:`Con <code>weil, dass, wenn, ob, obwohl, damit, als, während</code> el verbo conjugado va <b>al final</b>:
<br><code>Ich bleibe zu Hause, <b>weil</b> ich krank <b>bin</b>.</code>
<br><code>Ich weiß, <b>dass</b> er morgen <b>kommt</b>.</code>
<br>Si la subordinada va primero, la principal empieza por el verbo: <code><b>Weil</b> es regnet, <b>bleibe</b> ich zu Hause.</code>
<br>Ojo con <code>denn</code> (= porque, coordinante): el verbo va en posición normal, <code>…, denn ich <b>bin</b> krank.</code>`},
{l:"A2",t:"Comparativo y superlativo",b:`<code>schnell → schneller → am schnellsten</code>. Muchos monosílabos añaden Umlaut: <code>alt → älter → am ältesten</code>.
<br>Irregulares: <code>gut → besser → am besten</code>; <code>viel → mehr → am meisten</code>; <code>gern → lieber → am liebsten</code>; <code>hoch → höher</code>.
<br>Comparación: <code>so … wie</code> (igualdad) y <code>-er als</code> (desigualdad): <code>Er ist <b>so groß wie</b> ich.</code> / <code>Er ist <b>größer als</b> ich.</code>`},
{l:"A2",t:"Verbos reflexivos",b:`Pronombres: mich, dich, sich, uns, euch, sich.
<br><code>Ich <b>freue mich</b> auf den Urlaub.</code> · <code>Wir <b>treffen uns</b> um acht.</code>
<br>Con parte del cuerpo u objeto, el reflexivo va en <b>dativo</b>: <code>Ich wasche <b>mir</b> die Hände.</code>
<br>Muchos llevan preposición fija que hay que memorizar: <code>sich freuen <b>auf</b> (+Akk), sich interessieren <b>für</b>, sich ärgern <b>über</b>, sich erinnern <b>an</b></code>.`},
{l:"A2",t:"Konjunktiv II de cortesía",b:`Para pedir o sugerir con educación:
<br><code>könnte</code> (podría), <code>würde</code> (haría), <code>hätte</code> (tendría), <code>wäre</code> (sería), <code>möchte</code> (querría).
<br><code><b>Könnten</b> Sie mir bitte helfen?</code> · <code>Ich <b>hätte</b> gern einen Kaffee.</code> · <code><b>Würdest</b> du das Fenster öffnen?</code>`},
{l:"B1",t:"Declinación del adjetivo",b:`La regla clave: <b>la marca de caso aparece una sola vez</b>. Si el artículo ya la lleva, el adjetivo toma <code>-e/-en</code>; si no hay artículo, el adjetivo asume la terminación fuerte.
<table><tr><th></th><th>m. Nom</th><th>f. Nom</th><th>n. Nom</th><th>pl.</th></tr>
<tr><th>der/die/das</th><td>der gut<b>e</b> Mann</td><td>die gut<b>e</b> Frau</td><td>das gut<b>e</b> Kind</td><td>die gut<b>en</b> Leute</td></tr>
<tr><th>ein/kein/mein</th><td>ein gut<b>er</b> Mann</td><td>eine gut<b>e</b> Frau</td><td>ein gut<b>es</b> Kind</td><td>keine gut<b>en</b> Leute</td></tr>
<tr><th>sin artículo</th><td>gut<b>er</b> Wein</td><td>gut<b>e</b> Milch</td><td>gut<b>es</b> Brot</td><td>gut<b>e</b> Leute</td></tr></table>
En dativo y genitivo la terminación es casi siempre <b>-en</b>: <code>mit dem gut<b>en</b> Wein</code>.`},
{l:"B1",t:"Oraciones de relativo",b:`El pronombre relativo toma el <b>género y número del antecedente</b>, pero el <b>caso</b> de su función en la subordinada. El verbo va al final.
<table><tr><th></th><th>m.</th><th>f.</th><th>n.</th><th>pl.</th></tr>
<tr><th>Nom</th><td>der</td><td>die</td><td>das</td><td>die</td></tr>
<tr><th>Akk</th><td>den</td><td>die</td><td>das</td><td>die</td></tr>
<tr><th>Dat</th><td>dem</td><td>der</td><td>dem</td><td>denen</td></tr></table>
<code>Das ist der Mann, <b>der</b> nebenan wohnt.</code> (sujeto)
<br><code>Das ist der Mann, <b>den</b> ich gestern getroffen habe.</code> (CD)
<br><code>Das ist der Mann, <b>dem</b> ich geholfen habe.</code> (CI)`},
{l:"B1",t:"La voz pasiva",b:`<b>werden</b> + participio. El agente se introduce con <code>von</code> (persona) o <code>durch</code> (medio).
<br>Presente: <code>Das Haus <b>wird</b> renoviert.</code> (La casa está siendo renovada.)
<br>Pasado (Präteritum): <code>Das Haus <b>wurde</b> 1990 gebaut.</code>
<br>Perfekt: <code>Das Haus <b>ist</b> gebaut <b>worden</b>.</code> (worden, no geworden)
<br>Con modal: <code>Das muss heute gemacht <b>werden</b>.</code>
<br>Alternativas frecuentes: <code>man</code> + activa, o <code>sich lassen</code>.`},
{l:"B1",t:"Konjunktiv II irreal",b:`Para hipótesis, deseos y consejos: <code>würde</code> + infinitivo, o la forma propia en verbos frecuentes (<code>wäre, hätte, könnte, müsste, ginge, käme</code>).
<br><code><b>Wenn</b> ich mehr Zeit <b>hätte</b>, <b>würde</b> ich mehr reisen.</code> (Si tuviera más tiempo, viajaría más.)
<br>Pasado irreal: <code>hätte/wäre</code> + participio: <code>Wenn ich das gewusst <b>hätte</b>, <b>wäre</b> ich gekommen.</code>
<br>Consejo: <code>An deiner Stelle <b>würde</b> ich das nicht machen.</code> · <code>Du <b>solltest</b> mehr schlafen.</code>`},
{l:"B1",t:"Genitivo",b:`Indica posesión y sigue a ciertas preposiciones (<code>wegen, während, trotz, statt, innerhalb</code>).
<br>m./n.: <code>des</code> + sustantivo con <b>-(e)s</b>; f./pl.: <code>der</code>.
<br><code>das Auto <b>des</b> Mann<b>es</b></code> · <code>die Farbe <b>der</b> Tür</code> · <code><b>während des</b> Unterricht<b>s</b></code>
<br>Al hablar se sustituye a menudo por <code>von</code> + dativo: <code>das Auto <b>von dem</b> Mann</code>.`},
{l:"B1",t:"Verbos con preposición fija y pronombres da(r)-/wo(r)-",b:`Hay que memorizar preposición + caso: <code>warten <b>auf</b> (Akk), denken <b>an</b> (Akk), sich interessieren <b>für</b>, sprechen <b>über</b>, sich kümmern <b>um</b>, abhängen <b>von</b> (Dat)</code>.
<br>Para cosas se usan formas fusionadas: <code>da+für = <b>dafür</b></code>, <code>da+r+auf = <b>darauf</b></code>; en preguntas <code>wo+für = <b>wofür</b></code>, <code>wo+r+über = <b>worüber</b></code>.
<br><code><b>Worauf</b> wartest du? – Ich warte <b>darauf</b>, dass er anruft.</code>
<br>Para personas se mantiene la preposición: <code><b>Auf wen</b> wartest du?</code>`},
{l:"B1",t:"Finales e infinitivo con zu",b:`• <b>um … zu</b> + infinitivo cuando el sujeto es el mismo: <code>Ich lerne Deutsch, <b>um</b> in Wien <b>zu</b> arbeiten.</code>
<br>• <b>damit</b> cuando el sujeto cambia: <code>Ich erkläre es langsam, <b>damit</b> alle mich verstehen.</code>
<br>• Verbos con <code>zu</code>: <code>versuchen, vergessen, anfangen, aufhören, vorhaben, Lust haben</code>: <code>Ich habe vor, nächstes Jahr <b>zu</b> reisen.</code>
<br>Con verbos separables, el <code>zu</code> va en medio: <code>an<b>zu</b>rufen, ein<b>zu</b>kaufen</code>.`},
{l:"B1",t:"Futur I y expresión de la probabilidad",b:`<code>werden</code> + infinitivo al final. En alemán el futuro se expresa muy a menudo con el <b>presente</b> + marcador temporal: <code>Morgen fahre ich nach Hamburg.</code>
<br>El Futur I se usa sobre todo para pronósticos, promesas y suposiciones: <code>Er <b>wird</b> wohl im Stau <b>stehen</b>.</code> (Estará en un atasco, supongo.)
<br>Adverbios de probabilidad: <code>wahrscheinlich, vermutlich, wohl, bestimmt, sicher</code>.`},
{l:"B1",t:"Declinación en -n (n-Deklination)",b:`Un grupo de masculinos añade <b>-(e)n</b> en todos los casos menos el nominativo singular:
<code>der Nachbar → den Nachbar<b>n</b></code>, <code>der Student → dem Student<b>en</b></code>, <code>der Kollege, der Junge, der Mensch, der Kunde, der Herr</code> (→ <code>den Herr<b>n</b></code>).
<br><code>Ich habe <b>dem Kollegen</b> geholfen.</code>`}
];

/* ============ ESTADO ============ */
const KEY="dt_de_v1";
const defState={xp:0,correct:0,combo:0,bestCombo:0,days:0,lastDay:"",today:0,goal:60,hearts:3,badges:[],srs:{},artCorrect:0,gramCorrect:0,writeCorrect:0,b1Correct:0,levels:{A1:true,A2:true,B1:false},theme:""};
let S=load();

function load(){
  try{const r=localStorage.getItem(KEY);if(r)return Object.assign({},defState,JSON.parse(r));}catch(e){}
  return Object.assign({},defState);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function checkDay(){
  const t=todayStr();
  if(S.lastDay!==t){
    const y=new Date(Date.now()-864e5);
    const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
    S.days = (S.lastDay===ys)? S.days+1 : 1;
    S.lastDay=t; S.today=0; S.hearts=3; save();
  }
}
checkDay();

/* ============ UI BÁSICA ============ */
const $=s=>document.querySelector(s);
const view=$("#view");
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1900);}
function rankOf(xp){let r=RANKS[0][1],nx=RANKS[1][0];for(let i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0]){r=RANKS[i][1];nx=RANKS[i+1]?RANKS[i+1][0]:RANKS[i][0];}}return[r,nx];}
function hud(){
  const [r,nx]=rankOf(S.xp);
  $("#rank").textContent=r; $("#xp").textContent=S.xp; $("#combo").textContent=S.combo;
  $("#days").textContent=S.days; $("#today").textContent=S.today; $("#goal").textContent=S.goal;
  $("#heartsBox").textContent="❤️".repeat(S.hearts)+"🖤".repeat(3-S.hearts);
  const prev=RANKS.filter(x=>S.xp>=x[0]).pop()[0];
  const pct=nx>prev?Math.min(100,(S.xp-prev)/(nx-prev)*100):100;
  $("#xpbar").style.width=pct+"%";
}
function addXP(n){
  S.xp+=n; S.today+=n;
  if(S.today>=S.goal) unlock("goal");
  if(S.days>=3) unlock("days3"); if(S.days>=7) unlock("days7");
  save(); hud();
}
function right(item){
  S.correct++; S.combo++; if(S.combo>S.bestCombo)S.bestCombo=S.combo;
  const bonus = S.combo>=10?3 : S.combo>=5?2 : 0;
  addXP(10+bonus);
  unlock("start");
  if(S.correct>=10)unlock("c10"); if(S.correct>=50)unlock("c50"); if(S.correct>=150)unlock("c150");
  if(S.combo===5)unlock("combo5"); if(S.combo===10)unlock("combo10"); if(S.combo===20)unlock("combo20");
  if(item&&item.l==="B1"){S.b1Correct++; if(S.b1Correct>=15)unlock("b1");}
  if(bonus)toast("🔥 Combo x"+S.combo+" · +"+(10+bonus)+" XP");
  save();
}
function wrong(){ S.combo=0; save(); hud(); }
function loseHeart(){ S.hearts=Math.max(0,S.hearts-1); save(); hud(); if(S.hearts===0){toast("💔 Sin vidas. Se recargan mañana o con ↺ corazones."); } }
function unlock(id){ if(!S.badges.includes(id)){S.badges.push(id);save();const b=BADGES.find(x=>x.id===id);if(b)toast("🏅 Logro: "+b.n);} }

/* utilidades */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function sample(arr,n,not){const c=arr.filter(x=>x!==not);const out=[];while(out.length<n&&c.length){out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);}return out;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/^(der|die|das|ein|eine)\s+/,"")
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
    .replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u")
    .replace(/[^a-z ]/g,"").replace(/\s+/g," ");
}

function srsPick(){
  const p=pool(VOCAB);
  if(!p.length) return null;
  // prioriza cartas con caja baja o no vistas
  const weighted=[];
  p.forEach(v=>{const box=S.srs[v.w]||0;const w=Math.max(1,4-box);for(let i=0;i<w;i++)weighted.push(v);});
  return rnd(weighted);
}

    <div class="hint">Pulsa la barra espaciadora para girar la carta.</div>
  </div>`;
  const flip=()=>{$("#back").classList.remove("hidden");$("#a1").classList.add("hidden");$("#a2").classList.remove("hidden");};
  $("#flip").onclick=flip;
  view._space=flip;
  document.querySelectorAll("#a2 button").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;
    if(r===0){S.srs[v.w]=0;wrong();}
    else {S.srs[v.w]=Math.min(5,box+(r===2?2:1)); right(v);}
    save(); render();
  });
}

/* --- QUIZ ES↔DE --- */
function renderQuiz(){
  const p=pool(VOCAB); if(p.length<4){view.innerHTML="<div class='card'>Activa más niveles.</div>";return;}
  const v=srsPick(); const de2es=Math.random()<.5;
  const opts=shuffle([v,...sample(p,3,v)]);
  const q = de2es? v.w : v.es;
  const label = de2es? "¿Qué significa en español?" : "¿Cómo se dice en alemán?";
  view.innerHTML=`
  <div class="card pop">
    <div class="meta"><span>${v.l} · ${v.c}</span><span>${S.hearts>0?"❤️ "+S.hearts:"Sin vidas"}</span></div>
    <div class="center"><div class="hint" style="margin:0">${label}</div><div class="${de2es?'de':'es'}" style="margin-top:6px">${esc(q)}</div></div>
    <div class="opts" id="opts">
      ${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(de2es?o.es:o.w)}</button>`).join("")}
    </div>
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
    const chosen=opts[+b.dataset.i];
    document.querySelectorAll("#opts .opt").forEach((x,i)=>{x.disabled=true; if(opts[i]===v)x.classList.add("ok");});
    if(chosen===v){ b.classList.add("ok"); right(v); S.srs[v.w]=Math.min(5,(S.srs[v.w]||0)+1); }
    else { b.classList.add("no"); b.classList.add("shake"); wrong(); loseHeart(); S.srs[v.w]=0; }
    save();
    $("#fb").innerHTML=`<div class="feedback"><b>${esc(v.w)}</b> = ${esc(v.es)}<br><span class="exde">${esc(v.ex)}</span><br><span class="exes">${esc(v.exs)}</span></div>
      <div class="actions"><button class="btn primary" id="next">Siguiente →</button></div>`;
    $("#next").onclick=render; view._enter=render;
  });
}

/* --- ARTIKEL --- */
function renderArtikel(){
  const p=pool(VOCAB).filter(v=>v.g);
  if(!p.length){view.innerHTML="<div class='card'>No hay sustantivos en los niveles activos.</div>";return;}
  const v=rnd(p);
  view.innerHTML=`
  <div class="card center pop">
    <div class="meta"><span>${v.l} · género</span><span>Aciertos: ${S.artCorrect}</span></div>
    <div class="hint" style="margin:0">¿Qué artículo lleva?</div>
    <div class="de" style="margin-top:4px">___ ${esc(v.b)}</div>
    <div class="opts" style="grid-template-columns:repeat(3,1fr)">
      ${["der","die","das"].map(a=>`<button class="opt center" data-a="${a}" style="text-align:center;font-weight:700">${a}</button>`).join("")}
    </div>
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("[data-a]").forEach(x=>{x.disabled=true;if(x.dataset.a===v.g)x.classList.add("ok");});
    if(b.dataset.a===v.g){ right(v); S.artCorrect++; if(S.artCorrect>=20)unlock("art20"); }
    else { b.classList.add("no"); wrong(); }
    save(); hud();
    $("#fb").innerHTML=`<div class="feedback" style="text-align:left"><b>${esc(v.w)}</b> — ${esc(v.es)}<br>Plural: ${esc(v.pl||"—")}<br><span class="exde">${esc(v.ex)}</span></div>
      <div class="actions"><button class="btn primary" id="next">Siguiente →</button></div>`;
    $("#next").onclick=render; view._enter=render;
  });
}

/* --- GRAMÁTICA (quiz) --- */
function renderGram(){
  const p=pool(GQ); if(!p.length){view.innerHTML="<div class='card'>Activa algún nivel.</div>";return;}
  const q=rnd(p);
  const idx=q.o.map((_,i)=>i); shuffle(idx);
  view.innerHTML=`
  <div class="card pop">
    <div class="meta"><span>Gramática ${q.l}</span><span>Aciertos: ${S.gramCorrect}</span></div>
    <div class="center" style="font-size:1.25rem;font-weight:600;margin:8px 0">${esc(q.q)}</div>
    <div class="opts" id="opts">${idx.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#opts .opt").forEach(x=>{x.disabled=true; if(+x.dataset.i===q.a)x.classList.add("ok");});
    if(+b.dataset.i===q.a){ right(q); S.gramCorrect++; if(S.gramCorrect>=20)unlock("gram20"); }
    else { b.classList.add("no"); b.classList.add("shake"); wrong(); loseHeart(); }
    save(); hud();
    $("#fb").innerHTML=`<div class="feedback"><b>Por qué:</b> ${q.t}</div>
      <div class="actions"><button class="btn primary" id="next">Siguiente →</button></div>`;
    $("#next").onclick=render; view._enter=render;
  });
}

/* --- ESCRIBIR --- */
function renderWrite(){
  const v=srsPick(); if(!v){view.innerHTML="<div class='card'>Activa algún nivel.</div>";return;}
  view.innerHTML=`
  <div class="card center pop">
    <div class="meta"><span>${v.l} · ${v.c}</span><span>Escritas bien: ${S.writeCorrect}</span></div>
    <div class="hint" style="margin:0">Escríbelo en alemán${v.g?" (con artículo si quieres)":""}:</div>
    <div class="es" style="margin:8px 0">${esc(v.es)}</div>
    <input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tu respuesta…">
    <div class="umlauts">${["ä","ö","ü","ß","Ä","Ö","Ü"].map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div>
    <div class="actions">
      <button class="btn primary" id="check">Comprobar</button>
      <button class="btn" id="hint">Pista</button>
    </div>
    <div id="fb"></div>
  </div>`;
  const inp=$("#inp"); inp.focus();
  document.querySelectorAll(".umlauts button").forEach(b=>b.onclick=()=>{inp.value+=b.dataset.c;inp.focus();});
  $("#hint").onclick=()=>{ $("#fb").innerHTML=`<div class="feedback">Empieza por <b>${esc(v.w.replace(/^(der|die|das)\s+/,"").slice(0,2))}…</b> · ${v.w.replace(/^(der|die|das)\s+/,"").length} letras</div>`; };
  const check=()=>{
    const ok = norm(inp.value)===norm(v.w);
    if(ok){ right(v); S.writeCorrect++; if(S.writeCorrect>=10)unlock("write10"); S.srs[v.w]=Math.min(5,(S.srs[v.w]||0)+2); }
    else { wrong(); S.srs[v.w]=0; $(".card").classList.add("shake"); }
    save(); hud();
    $("#fb").innerHTML=`<div class="feedback">${ok?"✅ ¡Correcto!":"❌ Casi."} Respuesta: <b>${esc(v.w)}</b>${v.pl?" · pl. "+esc(v.pl):""}<br><span class="exde">${esc(v.ex)}</span><br><span class="exes">${esc(v.exs)}</span></div>
      <div class="actions"><button class="btn primary" id="next">Siguiente →</button></div>`;
    $("#next").onclick=render; view._enter=render;
    inp.disabled=true;
  };
  $("#check").onclick=check;
  inp.onkeydown=e=>{if(e.key==="Enter")check();};
}

/* --- CONJUGAR --- */
const PRON=["ich","du","er/sie/es","wir","ihr","sie/Sie"];
function renderVerbs(){
  const p=VERBS.filter(v=>S.levels[v.l]); if(!p.length){view.innerHTML="<div class='card'>Activa algún nivel.</div>";return;}
  const v=rnd(p); const pr=rnd(PRON); const correct=v.f[pr];
  const wrongs=shuffle(PRON.filter(x=>v.f[x]!==correct).map(x=>v.f[x])).slice(0,3);
  const opts=shuffle([correct,...new Set(wrongs)]).slice(0,4);
  if(!opts.includes(correct))opts[0]=correct;
  view.innerHTML=`
  <div class="card pop">
    <div class="meta"><span>Conjugación ${v.l}</span><span>Presente</span></div>
    <div class="center"><div class="hint" style="margin:0">${esc(v.v)} — ${esc(v.es)}</div>
    <div class="de" style="margin-top:6px">${esc(pr)} ___</div></div>
    <div class="opts" id="opts">${shuffle(opts).map((o,i)=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#opts .opt").forEach(x=>{x.disabled=true;if(x.dataset.o===correct)x.classList.add("ok");});
    if(b.dataset.o===correct) right(v); else {b.classList.add("no");wrong();}
    save();hud();
    $("#fb").innerHTML=`<div class="feedback"><b>${esc(v.v)}</b> (Perfekt: ${esc(v.pp)})<br>${PRON.map(x=>x+" <b>"+esc(v.f[x])+"</b>").join(" · ")}</div>
      <div class="actions"><button class="btn primary" id="next">Siguiente →</button></div>`;
    $("#next").onclick=render; view._enter=render;
  });
}

/* --- REGLAS --- */
function renderRef(){
  const p=GRAMMAR.filter(g=>S.levels[g.l]);
  view.innerHTML=`<div class="grid">${p.map(g=>`
    <details class="g"><summary>${g.l} · ${esc(g.t)}</summary><div class="body">${g.b}</div></details>`).join("")}</div>`;
}

/* --- LOGROS / ESTADÍSTICAS --- */
function renderStats(){
  const [r,nx]=rankOf(S.xp);
  const boxes=Object.values(S.srs).filter(x=>x>=4).length;
  view.innerHTML=`
  <div class="card">
    <h3 style="margin:0 0 6px">Tu progreso</h3>
    <div class="grid two">
      <div class="feedback">Rango: <b>${r}</b><br>XP total: <b>${S.xp}</b> · faltan ${Math.max(0,nx-S.xp)} para el siguiente</div>
      <div class="feedback">Respuestas correctas: <b>${S.correct}</b><br>Mejor combo: <b>${S.bestCombo}</b> · Racha: <b>${S.days}</b> día(s)</div>
      <div class="feedback">Palabras casi dominadas (caja 4-5): <b>${boxes}</b> de ${VOCAB.length}</div>
      <div class="feedback">Meta diaria: <b>${S.goal}</b> XP
        <div class="actions" style="justify-content:flex-start;margin-top:8px">
          <button class="btn" data-goal="30">30</button><button class="btn" data-goal="60">60</button><button class="btn" data-goal="120">120</button>
          <button class="btn" id="refillH">❤️ Recargar vidas</button>
        </div>
      </div>
    </div>
    <h3 style="margin:16px 0 0">Logros (${S.badges.length}/${BADGES.length})</h3>
    <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?"on":""}"><b>${b.i}</b>${esc(b.n)}<br><span style="color:var(--muted)">${esc(b.d)}</span></div>`).join("")}</div>
  </div>`;
  document.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();hud();renderStats();toast("Meta: "+S.goal+" XP/día");});
  $("#refillH").onclick=()=>{S.hearts=3;save();hud();toast("❤️ Vidas recargadas");};
}

/* ============ RENDER ============ */
function render(){
  view._space=null; view._enter=null;
  checkDay(); hud(); updatePoolInfo();
  ({flash:renderFlash,quiz:renderQuiz,artikel:renderArtikel,gram:renderGram,write:renderWrite,verbs:renderVerbs,ref:renderRef,stats:renderStats}[mode])();
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.code==="Space"&&view._space){e.preventDefault();view._space();}
  if(e.key==="Enter"&&view._enter){e.preventDefault();view._enter();}
});
$("#themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark"?"light":cur==="light"?"":"dark";
  if(next)document.documentElement.setAttribute("data-theme",next);else document.documentElement.removeAttribute("data-theme");
  S.theme=next; save();
};
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
$("#resetBtn").onclick=()=>{
  if(confirm("¿Borrar todo el progreso (XP, logros, cajas de repaso)?")){
    S=Object.assign({},defState); S.lastDay=""; save(); checkDay();
    document.querySelectorAll(".levels button").forEach(b=>b.setAttribute("aria-pressed",S.levels[b.dataset.lvl]?"true":"false"));
    render(); toast("Progreso reiniciado");
  }
};
render();
</script>
</body>
</html>
